name: Validate visual overhaul
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Build.ps1'
      - 'tests/**'
      - '.github/workflows/validate-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile with warnings as errors
        run: .\Build.ps1
      - name: Check synchronized version
        run: git diff --exit-code -- src/AssemblyInfo.cs README.md
      - name: Run isolated regression tests
        run: .\tests\Run.ps1
      - name: Offscreen navigation and resource acceptance (1080p and 4K)
        run: |
          .\tests\Run-Navigation.ps1 -OutputDirectory dist/navigation-1080p -ProductionBootstrap
          .\tests\Run-Navigation.ps1 -OutputDirectory dist/navigation-4k -FourK -ProductionBootstrap
      - name: Offscreen layout and restore acceptance
        run: .\tests\Run-Render.ps1
      - name: Preserve offscreen acceptance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offscreen-acceptance
          path: |
            dist/render-acceptance/*.png
            dist/render-acceptance/results.txt
            dist/navigation-1080p/*.png
            dist/navigation-1080p/results.txt
            dist/navigation-4k/*.png
            dist/navigation-4k/results.txt
          retention-days: 7
      - name: Verify output
        run: |
          if (-not (Test-Path dist/SteamDirect.exe)) { throw 'Executable missing' }
          Write-Output (Get-Item dist/SteamDirect.exe).Length
